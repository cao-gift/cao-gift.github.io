name: 构建博客

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.json
      - static/**
      - edgeone.json
      - .github/verify-site.mjs
      - .github/sync-plugins.mjs
      - .github/minify-theme.mjs
      - .github/workflows/Gmeek.yml
  issues:
    types: [opened, edited, closed, deleted, reopened, labeled, unlabeled, pinned, unpinned]
  schedule:
    - cron: "0 0,12 * * *"

concurrency:
  group: gmeek-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: 生成站点
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write
      issues: read
      pages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          ref: main

      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: 克隆生成器
        id: generator
        run: |
          GMEEK_VERSION=$(python3 -c "import json; print(json.load(open('config.json', encoding='utf-8'))['GMEEK_VERSION'])")
          git clone https://github.com/cao-gift/Gmeek.git .gmeek
          cd .gmeek
          if [ "$GMEEK_VERSION" = 'last' ]; then
            latestTaggedCommit=$(git rev-list --tags --max-count=1)
            if [ -n "$latestTaggedCommit" ]; then
              lastTag=$(git describe --tags "$latestTaggedCommit")
              git checkout "$lastTag"
            else
              echo "未找到标签，使用默认分支。"
            fi
          else
            git checkout "$GMEEK_VERSION"
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .gmeek/requirements.txt

      - name: 恢复渲染缓存
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/gmeek-cache
          key: gmeek-v2-${{ runner.os }}-${{ github.repository_id }}-${{ hashFiles('.gmeek/requirements.txt') }}-${{ steps.generator.outputs.ref }}-${{ hashFiles('blogBase.json') }}
          restore-keys: |
            gmeek-v2-${{ runner.os }}-${{ github.repository_id }}-${{ hashFiles('.gmeek/requirements.txt') }}-${{ steps.generator.outputs.ref }}-
            gmeek-v2-${{ runner.os }}-${{ github.repository_id }}-${{ hashFiles('.gmeek/requirements.txt') }}-

      - name: 安装依赖
        run: python -m pip install -r .gmeek/requirements.txt

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 编译并同步主题
        run: node .github/sync-plugins.mjs

      - name: 生成站点
        env:
          GMEEK_CACHE_DIR: ${{ runner.temp }}/gmeek-cache
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOG_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cp -r ./* .gmeek/
          cd .gmeek
          python Gmeek.py "$GH_TOKEN" "$BLOG_REPOSITORY" --issue_number "$ISSUE_NUMBER"
          rm -rf "${{ github.workspace }}/docs" "${{ github.workspace }}/backup"
          cp -a docs "${{ github.workspace }}/docs"
          cp -a backup "${{ github.workspace }}/backup"
          cp blogBase.json "${{ github.workspace }}/blogBase.json"

      - name: 校验产物并记录版本
        env:
          GMEEK_GENERATOR_SHA: ${{ steps.generator.outputs.ref }}
        run: |
          node .github/verify-site.mjs --write
          node docs/verify-release.mjs
          
      - name: 提交更新
        run: |
          git config --local user.email "$(python -c "import json; print(json.load(open('config.json', encoding='utf-8'))['email'])")"
          git config --local user.name "${{ github.repository_owner }}"
          git add docs backup blogBase.json README.md static/plugins
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m '🎉auto update by Gmeek action'
            git push
          fi

      - name: 上传统一发布产物
        uses: actions/upload-artifact@v6
        with:
          name: blog-site
          path: docs/
          if-no-files-found: error
          retention-days: 7
          
      - name: 上传站点
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/.'
          
  deploy:
    name: 发布站点
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
